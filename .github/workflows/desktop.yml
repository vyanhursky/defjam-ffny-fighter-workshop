name: Native desktop packages

on:
  pull_request:
  push:
    branches: [develop/0.1]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            target: windows-x64
            extension: zip
          - os: macos-15
            target: macos-arm64
            extension: zip
          - os: macos-15-intel
            target: macos-x64
            extension: zip
          - os: ubuntu-22.04
            target: linux-x64
            extension: tar.gz
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Linux desktop dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libegl1 libgl1 libnss3 libnspr4 libdbus-1-3 libfontconfig1 \
            libx11-xcb1 libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 libxcb-xkb1 \
            libxkbcommon-x11-0 libxkbcommon0 libasound2
      - name: Install native dependencies
        run: python -m pip install -e '.[desktop,dev,build,ps2]'
      - name: Synthetic codec, transaction and platform tests
        run: python -m pytest -q
      - name: Pose tests
        run: node --test tests/*.test.mjs
      - name: Build native package
        run: python scripts/package_desktop.py
      - name: Relocated frozen startup and authoring helper
        if: runner.os != 'Linux'
        # Hosted Mac/Windows VMs expose software graphics adapters that Chromium
        # blocklists. Permit them only for this offline CI check; still require
        # a real WebGL 2 context and keep the browser sandbox enabled.
        env:
          QTWEBENGINE_CHROMIUM_FLAGS: --ignore-gpu-blocklist
        run: |
          python scripts/smoke_package.py --archive dist/*-${{ matrix.target }}.${{ matrix.extension }} --output build/package-smoke
      - name: Linux relocated startup and authoring helper under X11
        if: runner.os == 'Linux'
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          QT_QPA_PLATFORM: xcb
          QTWEBENGINE_CHROMIUM_FLAGS: --use-gl=angle --use-angle=swiftshader --enable-unsafe-swiftshader
        run: |
          xvfb-run -a -s '-screen 0 1440x1000x24' python scripts/smoke_package.py --archive dist/*-${{ matrix.target }}.${{ matrix.extension }} --output build/package-smoke
      - name: Keep startup receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: startup-${{ matrix.target }}
          path: build/package-smoke
          if-no-files-found: ignore
      # Promote these validated packages only for an owner-authorized release.
      - name: Keep validated native package
        uses: actions/upload-artifact@v4
        with:
          name: workshop-${{ matrix.target }}
          path: |
            dist/*-${{ matrix.target }}.${{ matrix.extension }}
            dist/*-${{ matrix.target }}.${{ matrix.extension }}.sha256
