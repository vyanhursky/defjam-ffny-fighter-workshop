name: Synthetic Qt workflow tour

on:
  workflow_dispatch:
  schedule:
    - cron: '23 10 * * *'
  pull_request:
    paths:
      - 'src/defjam_caf/**'
      - 'scripts/synthetic_ui_smoke.py'
      - '.github/workflows/synthetic-ui.yml'

permissions:
  contents: read

jobs:
  ui-tour:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Desktop software graphics dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libegl1 libgl1 libnss3 libnspr4 libdbus-1-3 libfontconfig1 libx11-xcb1 libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 libxcb-xkb1 libxkbcommon-x11-0 libxkbcommon0 libasound2
      - name: Install constrained desktop test dependencies
        run: |
          python -m pip install -r requirements-build.txt
          python -m pip install --no-build-isolation -c requirements-build.txt -e '.[desktop,dev]'
      - name: Drive Home, Story and portable projects without game data
        env:
          QT_QPA_PLATFORM: xcb
          LIBGL_ALWAYS_SOFTWARE: '1'
          QTWEBENGINE_CHROMIUM_FLAGS: --use-gl=angle --use-angle=swiftshader --enable-unsafe-swiftshader
        run: |
          xvfb-run -a -s '-screen 0 1440x1000x24' python scripts/synthetic_ui_smoke.py --output build/ui-tour-wide --size 1440x940
          xvfb-run -a -s '-screen 0 1440x1000x24' python scripts/synthetic_ui_smoke.py --output build/ui-tour-compact --size 1100x760
      - name: Keep text-only workflow receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: synthetic-ui-receipt
          path: build/ui-tour-*/receipt.json
          if-no-files-found: warn
